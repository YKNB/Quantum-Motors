---
- name: Install required packages for Grafana
  apt:
    name:
      - wget
      - apt-transport-https
    state: present
    update_cache: yes

- name: Add Grafana GPG key
  apt_key:
    url: https://packages.grafana.com/gpg.key
    state: present

- name: Add Grafana APT repository
  apt_repository:
    repo: "deb https://packages.grafana.com/oss/deb stable main"
    state: present
    update_cache: yes

- name: Install Grafana
  apt:
    name: grafana
    state: present

- name: Create necessary directories for Grafana
  file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: '0755'
  loop:
    - /etc/grafana
    - /var/lib/grafana
    - /var/log/grafana

- name: Create Grafana service file
  copy:
    dest: /etc/systemd/system/grafana-server.service
    content: |
      [Unit]
      Description=Grafana instance
      After=network.target

      [Service]
      User=grafana
      ExecStart=/usr/sbin/grafana-server --config=/etc/grafana/grafana.ini --homepath=/usr/share/grafana
      Restart=always
      Environment="GF_PATHS_DATA=/var/lib/grafana" "GF_PATHS_LOGS=/var/log/grafana" "GF_PATHS_PLUGINS=/var/lib/grafana/plugins"

      [Install]
      WantedBy=multi-user.target
  notify:
    - Restart Grafana

- name: Enable and start Grafana
  systemd:
    name: grafana-server
    enabled: yes
    state: started
