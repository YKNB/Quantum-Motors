---
- name: Install dependencies
  apt:
    name: 
      - curl
      - openssh-server
      - ca-certificates
      - tzdata
    state: present
    update_cache: yes

- name: Add the GitLab package repository
  apt_repository:
    repo: "deb https://packages.gitlab.com/gitlab/gitlab-ce/ubuntu/ bionic main"
    state: present

- name: Install GitLab
  apt:
    name: gitlab-ce
    state: latest

- name: Configure GitLab
  template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
  notify: 
    - reconfigure gitlab

- name: Start GitLab services
  systemd:
    name: gitlab-runsvdir
    state: started
    enabled: yes

- name: Wait for GitLab to start
  wait_for:
    port: 80
    delay: 30
