- name: Pull SonarQube Docker image
  docker_image:
    name: "{{ sonarqube_image }}"
    source: pull

- name: Run SonarQube container
  docker_container:
    name: sonarqube
    image: "{{ sonarqube_image }}"
    state: started
    restart_policy: always
    ports:
      - "{{ sonarqube_port }}:9000"
    env:
      SONAR_JDBC_URL: "{{ sonarqube_db_url }}"
      SONAR_JDBC_USERNAME: "{{ sonarqube_db_username }}"
      SONAR_JDBC_PASSWORD: "{{ sonarqube_db_password }}"
    volumes:
      - "{{ sonarqube_data_volume }}:/opt/sonarqube/data"
      - "{{ sonarqube_bundled_plugins_volume }}:/opt/sonarqube/bundled-plugins"
      - "{{ sonarqube_logs_volume }}:/opt/sonarqube/logs"
      - ~/sonarqube-plugins:/opt/sonarqube/extensions  # Mount the directory with your custom plugin

# Define volumes to persist data
- name: Create SonarQube Docker volumes
  docker_volume:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ sonarqube_data_volume }}"
    - "{{ sonarqube_bundled_plugins_volume }}"
    - "{{ sonarqube_logs_volume }}"
