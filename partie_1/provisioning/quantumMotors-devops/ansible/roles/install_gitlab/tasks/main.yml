---
# 1. Installer les dépendances nécessaires
- name: Install required packages for GitLab
  apt:
    name:
      - curl
      - openssh-server
      - ca-certificates
      - postfix
      - tzdata
    state: present
    update_cache: yes
  tags: 
    - install_dependencies

# 2. Ajouter le dépôt GitLab
- name: Add GitLab package repository
  apt_repository:
    repo: 'deb https://packages.gitlab.com/gitlab/gitlab-ee/ubuntu/ bionic main'
    state: present
  tags: 
    - add_gitlab_repo
  

# 3. Installer GitLab EE
- name: Install GitLab EE
  apt:
    name: gitlab-ee
    state: present
  tags: 
    - install_gitlab

# 4. Configurer GitLab
- name: Configurer GitLab
  template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
  notify: Reconfigurer GitLab
  tags:
    - configure_gitlab

# 4. Reconfigure GitLab
- name: Reconfigure GitLab
  command: gitlab-ctl reconfigure
  tags: 
    - reconfigure_gitlab
