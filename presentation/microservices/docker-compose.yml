version: '3.8'

services:
  traefik:
    image: traefik:v2.5
    command:
      - "--api.insecure=true"
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"  # Port HTTP pour les requêtes vers les microservices
      - "8080:8080"  # Port pour accéder au dashboard de Traefik
    networks:
      - quantum-network
    deploy:
      placement:
        constraints:
          - node.role == manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: P@ssw0rd!
      MYSQL_DATABASE: quantum-motors
      MYSQL_USER: user
      MYSQL_PASSWORD: P@ssw0rd!
    volumes:
      - my-db:/var/lib/mysql
      - ./quantum-motors-initial.sql:/docker-entrypoint-initdb.d/quantum-motors-initial.sql
    networks:
      - quantum-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  battery-service:
    build: ./battery-service
    environment:
      - DATABASE_HOST=db
      - DATABASE_USER=user
      - DATABASE_PASSWORD=P@ssw0rd!
      - DATABASE_NAME=quantum-motors
    networks:
      - quantum-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.battery.loadbalancer.server.port=3000"
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
    depends_on:
      - db

  car-service:
    build: ./car-service
    environment:
      - DATABASE_HOST=db
      - DATABASE_USER=user
      - DATABASE_PASSWORD=P@ssw0rd!
      - DATABASE_NAME=quantum-motors
    networks:
      - quantum-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.car.loadbalancer.server.port=3000"
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
    depends_on:
      - db

  color-service:
    build: ./color-service
    environment:
      - DATABASE_HOST=db
      - DATABASE_USER=user
      - DATABASE_PASSWORD=P@ssw0rd!
      - DATABASE_NAME=quantum-motors
    networks:
      - quantum-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.color.loadbalancer.server.port=3000"
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
    depends_on:
      - db

  finish-service:
    build: ./finish-service
    environment:
      - DATABASE_HOST=db
      - DATABASE_USER=user
      - DATABASE_PASSWORD=P@ssw0rd!
      - DATABASE_NAME=quantum-motors
    networks:
      - quantum-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.finish.loadbalancer.server.port=3000"
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
    depends_on:
      - db

  model-service:
    build: ./model-service
    environment:
      - DATABASE_HOST=db
      - DATABASE_USER=user
      - DATABASE_PASSWORD=P@ssw0rd!
      - DATABASE_NAME=quantum-motors
    networks:
      - quantum-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.model.loadbalancer.server.port=3000"
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
    depends_on:
      - db

  gateway:
    build: ./gateway-service
    environment:
      - DATABASE_HOST=db
      - DATABASE_USER=user
      - DATABASE_PASSWORD=P@ssw0rd!
      - DATABASE_NAME=quantum-motors
    networks:
      - quantum-network
    ports:
      - "8086:8080"
    env_file:
      - ./gateway-service/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.gateway.loadbalancer.server.port=8080"
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
    depends_on:
      - db

  frontend:
    build: ./frontend  # Assure-toi que le Dockerfile pour le frontend est dans ce dossier
    environment:
      - NEXT_PUBLIC_API_URL=http://gateway:8080
    ports:
      - "4200:4200"
    networks:
      - quantum-network
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
    depends_on:
      - gateway

networks:
  quantum-network:
    driver: overlay

volumes:
  my-db:
